[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-to-azdo"
version = "0.3.0"
description = "CLI to convert and transfer GitHub Actions workflows to Azure Pipelines"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6,<7",
    "cryptography>=43,<49",
]

[project.scripts]
gh-to-azdo = "github_to_azdo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
