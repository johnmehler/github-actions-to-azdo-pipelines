name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python
        run: python --version
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Build placeholder
        shell: pwsh
        run: Write-Output 'Build step placeholder'
      - name: Smoke check
        run: echo done
